name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: go-starry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: go-starry-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            go-starry-npm-${{ runner.os }}-
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Run tests and TypeScript check in parallel
        shell: bash
        run: |
          set +e
          npm test &
          test_pid=$!
          npm run typecheck &
          type_pid=$!
          wait "$test_pid"
          test_status=$?
          wait "$type_pid"
          type_status=$?
          if [ "$test_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            exit 1
          fi
