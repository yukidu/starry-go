name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'worker/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/deploy-trigger'
  workflow_dispatch:

concurrency:
  group: go-starry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: go-starry-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            go-starry-npm-${{ runner.os }}-
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Run tests and TypeScript check in parallel
        shell: bash
        run: |
          set +e
          npm test &
          test_pid=$!
          npm run typecheck &
          type_pid=$!
          wait "$test_pid"
          test_status=$?
          wait "$type_pid"
          type_status=$?
          if [ "$test_status" -ne 0 ] || [ "$type_status" -ne 0 ]; then
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply go-starry-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify-home:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test production URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://go.starry.phd/ > /tmp/go-starry-home.html
          test -s /tmp/go-starry-home.html
          grep -qi "go\.starry\.phd\|短網址\|Starry" /tmp/go-starry-home.html

  verify-qr:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify QR generator production routes
        shell: bash
        run: |
          qr_assets_ready=false
          for attempt in $(seq 1 12); do
            echo "QR asset verification attempt $attempt/12"
            if curl --fail --silent --show-error --max-time 20 \
              "https://go.starry.phd/app.js?v11&deploy=${GITHUB_SHA}" > /tmp/go-starry-app.js \
              && grep -q 'qrGenerateV11' /tmp/go-starry-app.js \
              && grep -q '/api/qr-generator' /tmp/go-starry-app.js; then
              qr_assets_ready=true
              break
            fi
            sleep 5
          done
          test "$qr_assets_ready" = "true" || { echo "::error::QR generator v11 assets did not reach production in time"; exit 1; }

          page_result="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}|%{redirect_url}' --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 https://go.starry.phd/qr-generator)"
          page_status="${page_result%%|*}"
          page_redirect="${page_result#*|}"
          echo "QR generator page: HTTP $page_status -> $page_redirect"
          test "$page_status" = "302" || { echo "::error::QR generator page expected HTTP 302 for guest, got $page_status"; exit 1; }
          test "$page_redirect" = "https://go.starry.phd/auth/starry" || { echo "::error::QR generator page redirect mismatch: $page_redirect"; exit 1; }

          api_status="$(curl --silent --show-error --output /tmp/go-starry-qr-api.json --write-out '%{http_code}' --retry 6 --retry-delay 3 --retry-all-errors --max-time 20 -X POST -H 'content-type: application/json' --data '{"content":"Starry QR smoke test","size":512}' https://go.starry.phd/api/qr-generator)"
          echo "QR generator API guest guard: HTTP $api_status"
          test "$api_status" = "401" || { echo "::error::QR generator API expected HTTP 401 for guest, got $api_status"; exit 1; }
          grep -q '請先登入' /tmp/go-starry-qr-api.json || { echo "::error::QR generator API guest response did not contain the login guard"; exit 1; }

  verify-sso:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Starry ID central SSO routes
        shell: bash
        run: |
          check_redirect() {
            name="$1"
            source_url="$2"
            expected_url="$3"
            result="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}|%{redirect_url}' --max-time 20 "$source_url")"
            status="${result%%|*}"
            redirect_url="${result#*|}"
            echo "$name: HTTP $status -> $redirect_url"
            test "$status" = "302" || { echo "::error::$name expected HTTP 302, got $status"; exit 1; }
            test "$redirect_url" = "$expected_url" || { echo "::error::$name expected redirect $expected_url, got $redirect_url"; exit 1; }
          }

          check_redirect "Go Starry Starry-ID route" "https://go.starry.phd/auth/starry" "https://id.starry.phd/auth/gostarry"
          check_redirect "Go Starry Google account chooser route" "https://go.starry.phd/auth/starry?choose=1" "https://id.starry.phd/auth/gostarry?choose=1"
          check_redirect "Go Starry one-tap account switch" "https://go.starry.phd/auth/switch" "https://id.starry.phd/auth/gostarry?choose=1"
          check_redirect "Go Starry legacy Google route" "https://go.starry.phd/auth/google" "https://id.starry.phd/auth/gostarry"
          check_redirect "Go Starry invalid callback" "https://go.starry.phd/auth/callback" "https://go.starry.phd/?starry=error"

          central_result="$(curl --silent --show-error --output /tmp/go-starry-central-login.html --write-out '%{http_code}|%{redirect_url}' --max-time 20 https://id.starry.phd/auth/gostarry)"
          central_status="${central_result%%|*}"
          central_redirect="${central_result#*|}"
          echo "Starry ID central entry: HTTP $central_status -> $central_redirect"
          case "$central_status" in
            200) test -s /tmp/go-starry-central-login.html ;;
            301|302|303|307|308) test -n "$central_redirect" ;;
            *) echo "::error::Starry ID central SSO returned unexpected HTTP status: $central_status"; exit 1 ;;
          esac

          chooser_status="$(curl --silent --show-error --output /tmp/go-starry-central-chooser.html --write-out '%{http_code}' --max-time 20 'https://id.starry.phd/auth/gostarry?choose=1')"
          echo "Starry ID Google account chooser: HTTP $chooser_status"
          test "$chooser_status" = "200"
          test -s /tmp/go-starry-central-chooser.html
          grep -q 'FORCE_ACCOUNT_CHOICE=true' /tmp/go-starry-central-chooser.html

  summary:
    needs: [verify-home, verify-qr, verify-sso]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "### go-starry production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://go.starry.phd" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Home smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- QR generator verification: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Starry ID central SSO verification: passed" >> "$GITHUB_STEP_SUMMARY"
